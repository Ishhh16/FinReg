version: '3.8'

services:
  db:
    image: postgres:14
    container_name: finreg_db
    restart: always
    environment:
      POSTGRES_USER: finreg
      POSTGRES_PASSWORD: finreg123
      POSTGRES_DB: finreg_db
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=en_US.UTF-8 --lc-ctype=en_US.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finreg -d finreg_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - finreg_network
  
  api:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: finreg_api
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://finreg:finreg123@db:5432/finreg_db
    volumes:
      - ./backend:/app/backend
      - ./temp:/app/temp
      - ./chroma_db:/app/chroma_db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - finreg_network

  # Optional: Add pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: finreg_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@finreg.local
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      - db
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - finreg_network
    profiles:
      - admin

networks:
  finreg_network:
    driver: bridge

volumes:
  db_data:
  pgadmin_data: